run:
  timeout: 3m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  max-same-issues: 0
  exclude-rules:
    # Deferred Rollback and bare Commit in tests are best-effort pgx patterns.
    - path: _test\.go
      linters:
        - errcheck
      text: "Error return value of"
