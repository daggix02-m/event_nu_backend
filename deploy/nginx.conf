# Event Nu backend — nginx reverse proxy, TLS termination.
#
# Template: replace EVENTS.EXAMPLE.COM with the deployed domain (the runbook
# walks through it and the Let's Encrypt issuance step). ACME webroot lives on
# docker volume `webroot`; issued certs on volume `cert_data`.
#
# Publishing model:
#   - loopback :8080 for ops smoke tests only (never put this in front of an
#     ingress; the app speaks plain HTTP and trusts the proxy below).
#   - 80 for ACME + redirect, 443 for API traffic.

# Real client IP for rate limiting / request logs (the app reads the first
# X-Forwarded-For value, which we set ourselves — not spoofable from outside
# because we never proxy a visitor-supplied XFF through).
server {
    listen 80;
    server_name EVENTS.EXAMPLE.COM;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name EVENTS.EXAMPLE.COM;

    ssl_certificate     /etc/letsencrypt/live/EVENTS.EXAMPLE.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/EVENTS.EXAMPLE.COM/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ssl_session_cache:10m;

    # HSTS once TLS issuance is settled (do not tighten before the cert test
    # passes, clients will refuse downgrades).
    add_header Strict-Transport-Security "max-age=15552000" always;

    # Register/upload bodies; MEDIA_MAX_UPLOAD_BYTES must stay below this.
    # The app also self-caps at 1 MiB for JSON bodies.
    client_max_body_size 25m;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_intercept_errors off;
    }
}
